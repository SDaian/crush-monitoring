name: Congress trades refresh

on:
  schedule:
    # Target ~9am Madrid (07:00 UTC summer). GitHub scheduled runs are
    # best-effort — frequently delayed 1–3h and sometimes DROPPED ENTIRELY. So
    # we fire MULTIPLE times across the morning: GitHub would have to skip every
    # one to miss a day, and the report is idempotent per day (report_state) so
    # the first firing sends and the rest no-op the email. Public repo → the
    # extra runs are free. Whichever fires first biases early ("before the day
    # starts"), late is the failure mode. Cron is UTC and ignores DST (±1h drift
    # over the year). For a hard timing guarantee an external scheduler hitting
    # the workflow_dispatch API would still be needed.
    - cron: "30 4 * * *"
    - cron: "0 6 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new filings per chamber this run (empty = no cap)"
        required: false
        default: ""
      report:
        description: "Also send the morning report issue (true to test on demand)"
        required: false
        default: "false"
      report_only:
        description: "Skip every data step and ONLY build/send the report (fast test)"
        required: false
        default: "false"
      social_dry_run:
        description: "Social step: render cards + copy but write NO Typefully drafts"
        required: false
        default: "false"
      social_filing:
        description: "Draft THIS filing_id now (editorial override; skips the state + notability bar)"
        required: false
        default: ""
      social_focus:
        description: "Tickers the drafted post is about, e.g. BWXT,ENTG (needs social_filing)"
        required: false
        default: ""
permissions:
  contents: write
  issues: write # open an issue (→ email) when a new AI technical signal fires

concurrency:
  group: congress-trades
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: congress/requirements.txt

      # Node is only used by the social step's card renderer (Playwright lib
      # + the runner's preinstalled Chrome — no browser download).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install fetcher dependencies
        run: pip install -r congress/requirements.txt

      - name: Offline tests (parsers must be green before touching live sites)
        run: python3 -m unittest discover -s tests/congress -p 'test_*.py'

      - name: Refresh member roster (non-fatal)
        if: github.event.inputs.report_only != 'true'
        run: |
          python3 -m congress roster \
            || echo "::warning::roster refresh failed; using committed members.json"

      - name: Fetch new filings
        if: github.event.inputs.report_only != 'true'
        run: |
          set -o pipefail # tee must not mask the fetcher's exit code
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            EXTRA="--limit ${{ github.event.inputs.limit }} --debug-dump debug-dump"
          else
            EXTRA="" # full scheduled run: no dump (it would be huge)
          fi
          # --reparse-invalid on every run: rows that break an invariant
          # (amount_hi < amount_lo — the "$200 late-filing fee" bug) have
          # their WHOLE filing forgotten and re-fetched, so a parser fix
          # actually reaches data that was published before it. state.json
          # gates by filing_id, so without this a bad row stays live forever.
          # Normally zero rows match and the flag is a no-op.
          python3 -m congress fetch --reparse-invalid $EXTRA 2>&1 | tee fetch.log

      - name: Refresh featured-member holdings (non-fatal)
        if: github.event.inputs.report_only != 'true'
        run: |
          # Real stock composition from each featured member's latest annual
          # financial-disclosure report. Rarely changes (annual), but cheap to
          # re-check. A source outage must not fail the whole refresh.
          python3 -m congress holdings 2>&1 | tee -a fetch.log \
            || echo "::warning::holdings refresh failed; keeping prior holdings.json"
          # Commit holdings here (not in the final step) so it lands even if the
          # slow price step below stalls on a rate limit. Stage first, then test
          # the *staged* diff — holdings.json may be a brand-new untracked file
          # that a plain `git diff` would not see.
          git add docs/data/holdings.json
          if ! git diff --cached --quiet -- docs/data/holdings.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "congress: holdings refresh ($(date -u +%F))"
            # --autostash: the fetch step may have left congress-trades.json /
            # state.json dirty (uncommitted); without it the rebase aborts with
            # "cannot pull with rebase: You have unstaged changes".
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Regenerate landing-page data (non-fatal)
        if: github.event.inputs.report_only != 'true'
        run: |
          # Feed + stats + /late + per-member pages for the Capitol Ledger
          # landing site, derived from the trades JSON the fetch step refreshed
          # and the holdings.json the step above just refreshed (member pages
          # show the estimated portfolio). Runs AFTER holdings so member pages
          # reflect the freshest annual data. Committed with the trades in the
          # final step; the push triggers Vercel's rebuild.
          python3 -m congress landing 2>&1 | tee -a fetch.log \
            || echo "::warning::landing data refresh failed; keeping prior files"

      - name: Draft social posts for notable new filings (non-fatal)
        if: github.event.inputs.report_only != 'true'
        env:
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          # Live drafting is DOUBLE-gated: the secret must exist AND the repo
          # variable SOCIAL_LIVE must be "true". Until both are set every run
          # is a dry-run that renders cards as artifacts and writes nothing —
          # the Typefully API surface is documented-but-unverified from the
          # dev sandbox (see congress/typefully.py), so live stays opt-in.
          SOCIAL_LIVE: ${{ vars.SOCIAL_LIVE }}
          SOCIAL_CAP: ${{ vars.SOCIAL_CAP }}
        run: |
          # Card rendering needs the playwright lib (browser = the runner's
          # preinstalled Chrome, no download). npm ci is cached by setup-node.
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tail -1
          DRY=""
          if [ "${{ github.event.inputs.social_dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi
          # Editorial override: draft one named filing, optionally headlined
          # by chosen tickers, instead of the usual new-filings sweep.
          PICK=""
          if [ -n "${{ github.event.inputs.social_filing }}" ]; then
            PICK="--filing ${{ github.event.inputs.social_filing }}"
            if [ -n "${{ github.event.inputs.social_focus }}" ]; then
              PICK="$PICK --focus ${{ github.event.inputs.social_focus }}"
            fi
          fi
          python3 -m congress social $DRY $PICK --out-dir social-cards 2>&1 | tee -a fetch.log \
            || echo "::warning::social drafting failed (non-fatal)"

      - name: Upload rendered social cards (inspection artifact)
        if: github.event.inputs.report_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: social-cards
          path: social-cards/
          if-no-files-found: ignore
          retention-days: 7

      - name: Refresh AI technical indicators + notify on new signals (non-fatal)
        if: github.event.inputs.report_only != 'true'
        env:
          CONGRESS_PRICES_KEY: ${{ secrets.CONGRESS_PRICES_KEY || vars.CONGRESS_PRICES_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Daily mechanical indicators (RSI / moving averages / volume / 52w)
          # for the AI universe + named signals. Reuses the Twelve Data key.
          # A source outage must not fail the whole refresh.
          python3 -m congress ai --skip-if-fresh 2>&1 | tee -a fetch.log \
            || echo "::warning::AI indicators refresh failed; keeping prior ai-indicators.json"
          # Open a GitHub issue (emails repo watchers) for each brand-new signal.
          # Runs before the commit so a fresh file's new_signals are read; the
          # dedup memory in the file prevents re-notifying next run.
          python3 -m congress.notify_signals 2>&1 | tee -a fetch.log \
            || echo "::warning::signal notification failed (non-fatal)"
          # Commit here (not in the final step) so it lands even if the slow
          # price step below stalls. Stage first, then test the staged diff —
          # ai-indicators.json may be brand-new/untracked.
          git add docs/data/ai-indicators.json
          if ! git diff --cached --quiet -- docs/data/ai-indicators.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "congress: AI indicators refresh ($(date -u +%F))"
            # --autostash: fetch/holdings may have left other generated files
            # dirty; stash them across the rebase so it doesn't abort.
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Morning report → GitHub issue email (scheduled/on-demand, non-fatal)
        # report_only implies report — otherwise setting it alone would skip
        # every data step AND the report, running nothing at all.
        if: >-
          github.event_name == 'schedule'
          || github.event.inputs.report == 'true'
          || github.event.inputs.report_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # SMTP (optional) — primary delivery straight to the inbox, reliable
          # regardless of GitHub notification settings. Set SMTP_USER/SMTP_PASS
          # (e.g. a Gmail address + App Password) as repo secrets to enable.
          # SMTP_USER (your email) isn't sensitive — accept it as a secret OR a
          # variable so it works wherever you added it. SMTP_PASS stays secret.
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          REPORT_EMAIL_TO: ${{ vars.REPORT_EMAIL_TO }}
          # Send as the brand (e.g. daily@capitolledger.io) while
          # authenticating as SMTP_USER. Must be an address the SMTP
          # host may send for, or SPF/DKIM alignment fails.
          REPORT_EMAIL_FROM: ${{ vars.REPORT_EMAIL_FROM }}
          # Vercel Web Analytics (optional) — adds a site-traffic block to the
          # report. Set VERCEL_TOKEN (secret) + VERCEL_PROJECT_ID (variable);
          # VERCEL_TEAM_ID only if the project lives under a team. Unset → the
          # report simply omits the traffic section.
          # PROJECT_ID / TEAM_ID aren't sensitive, but accept them as a secret
          # OR a variable so they work wherever they were added.
          # Where the email's ticker deep-links point. Set this to the live
          # deployment (e.g. https://<project>.vercel.app) until the apex
          # domain is registered — otherwise the links 404.
          SITE_URL: ${{ vars.SITE_URL }}
          # Buttondown (optional) — broadcasts the same digest to confirmed
          # subscribers. Unset → only the owner's SMTP copy goes out.
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID }}
          # An explicit on-demand run (report=true) always delivers, even if a
          # report already went out today; the scheduled run stays idempotent.
          REPORT_FORCE: ${{ (github.event.inputs.report == 'true' || github.event.inputs.report_only == 'true') && 'true' || '' }}
        run: |
          # Compose the morning digest (AI scorecard + overnight signals +
          # rating flips + new disclosures), email it via SMTP, and open a dated
          # issue → also notifies via GitHub.
          # Runs before the slow price step so it lands on time; reads the
          # fresh working-tree trades/AI files. A failure must not fail the run.
          python3 -m congress.daily_report 2>&1 | tee -a fetch.log \
            || echo "::warning::morning report failed (non-fatal)"
          # report_state.json = tomorrow's flip diff; report.json = the web
          # edition rendered by /report; reports/ = the dated archive
          # (/report/<date> + /report/archive). Commit all so the site rebuilds.
          git add congress/report_state.json landing/src/data/report.json landing/src/data/reports
          if ! git diff --cached --quiet -- congress/report_state.json landing/src/data/report.json landing/src/data/reports; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "congress: morning report state ($(date -u +%F))"
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Estimate return-since-buy (non-fatal)
        if: github.event.inputs.report_only != 'true'
        env:
          # Accept the key whether it was added as an Actions *secret* (preferred)
          # or an Actions *variable* — both live under the same settings page.
          CONGRESS_PRICES_KEY: ${{ secrets.CONGRESS_PRICES_KEY || vars.CONGRESS_PRICES_KEY }}
        run: |
          # Prices move daily even when no new filing arrives, so this runs
          # every day. A price-source outage must not fail the whole refresh.
          python3 -m congress prices --skip-if-fresh 2>&1 | tee -a fetch.log \
            || echo "::warning::price refresh failed; keeping prior returns.json"
          # The landing step above ran before prices, so the member pages'
          # performance section was built from YESTERDAY's returns. Re-run the
          # (cheap, pure-local) landing generation now that today's returns
          # and performance series exist, so the pages ship today's numbers.
          python3 -m congress landing 2>&1 | tee -a fetch.log \
            || echo "::warning::landing re-run after prices failed; pages keep the earlier data"

      - name: Commit refreshed data
        if: github.event.inputs.report_only != 'true'
        run: |
          # Every path `congress landing` writes has to be listed here, or the
          # generator runs daily and its output is silently thrown away —
          # landing/src/data/tickers was missing, so the ticker pages served
          # whatever a manual run last happened to commit (TSM was 2 months
          # and 1 trade behind the tracker).
          FILES="docs/data/congress-trades.json congress/state.json congress/social_state.json congress/members.json docs/data/returns.json docs/data/performance.json landing/src/data/disclosures.json landing/src/data/stats.json landing/src/data/late.json landing/src/data/members landing/src/data/tickers"
          if git diff --quiet -- $FILES; then
            echo "No new trades or price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "congress: trades + returns refresh ($(date -u +%F))"
          # The branch may have moved while the fetch ran; rebase our data
          # commit on top rather than failing the push. --autostash guards any
          # residual dirty files; -X theirs auto-resolves a conflict in a
          # generated data file to THIS run's freshly-computed version (rebase
          # "theirs" = the commit being replayed) instead of aborting exit 1.
          git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"
          git push

      # Push half of search indexing: tell the Bing/Yandex family which pages
      # today's refresh changed (Google ignores IndexNow; the sitemap covers
      # it). After the data push so the deploy is underway; non-fatal — a
      # search ping must never fail the refresh.
      - name: Ping IndexNow with refreshed pages (non-fatal)
        if: github.event.inputs.report_only != 'true'
        run: |
          python3 -m congress indexnow 2>&1 | tee -a fetch.log \
            || echo "::warning::IndexNow ping failed (non-fatal)"

      # Catch-all for the failure mode a drifting FILES list causes: a
      # generator wrote something no step stages, so it is discarded at the
      # next run's checkout while every step reports success — that is how
      # landing/src/data/tickers went two months stale.
      # tests/congress/test_workflow_paths.py catches this at PR time for the
      # landing generators; this catches it at run time for anything else.
      #
      # Its own step, so it also runs on the "no new trades" early exit above,
      # and it runs AFTER the push: the refreshed data is already safe, so a
      # false positive turns the run red instead of skipping a day of data.
      - name: Verify every generated file was committed
        if: github.event.inputs.report_only != 'true'
        run: |
          # Unstaged/untracked show as " M" / "??" — a leading space or ?.
          LEFTOVER=$(git status --porcelain -- docs/data landing/src/data congress \
                     | grep -E '^( |\?)' || true)
          if [ -n "$LEFTOVER" ]; then
            echo "::error::a generator wrote files no step commits — they will"
            echo "::error::be discarded at the next checkout. Add them to FILES:"
            echo "$LEFTOVER"
            exit 1
          fi
          echo "All generated data is committed."

      - name: Upload fetch log and raw payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: congress-fetch-debug
          path: |
            fetch.log
            debug-dump/
          if-no-files-found: ignore
          retention-days: 7
