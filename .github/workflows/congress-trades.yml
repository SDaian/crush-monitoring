name: Congress trades refresh

on:
  schedule:
    - cron: "17 9 * * *" # daily, off the :00 stampede
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new filings per chamber this run (empty = no cap)"
        required: false
        default: ""
permissions:
  contents: write

concurrency:
  group: congress-trades
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: congress/requirements.txt

      - name: Install fetcher dependencies
        run: pip install -r congress/requirements.txt

      - name: Offline tests (parsers must be green before touching live sites)
        run: python3 -m unittest discover -s tests/congress -p 'test_*.py'

      - name: Refresh member roster (non-fatal)
        run: |
          python3 -m congress roster \
            || echo "::warning::roster refresh failed; using committed members.json"

      - name: Fetch new filings
        run: |
          set -o pipefail # tee must not mask the fetcher's exit code
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            EXTRA="--limit ${{ github.event.inputs.limit }} --debug-dump debug-dump"
          else
            EXTRA="" # full scheduled run: no dump (it would be huge)
          fi
          python3 -m congress fetch $EXTRA 2>&1 | tee fetch.log

      - name: TEMP OGE probe (Trump 278-T format)
        run: |
          python3 - <<'PY'
          import io, re, requests, pdfplumber
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}
          def get(url, **k):
              try:
                  r=requests.get(url, headers=UA, timeout=45, **k); return r
              except Exception as e:
                  print("  ERR", e); return None
          # 1) Enumerate the PAS Index view fully as XML, and find Trump's entries.
          #    The view is categorized by filer; expand it to reach documents.
          for view in [
              "https://extapps2.oge.gov/201/Presiden.nsf/PAS+Index?ReadViewEntries&OutputFormat=XML&ExpandView&count=400",
              "https://extapps2.oge.gov/201/Presiden.nsf/PAS+Index?ReadViewEntries&OutputFormat=XML&RestrictToCategory=Trump%2C+Donald+J.&count=60",
          ]:
              r=get(view)
              print("VIEW", r.status_code if r else "n/a", view)
              if r and r.ok:
                  t=r.text
                  print("  len", len(t))
                  # Show any Trump-related slice with surrounding noteids/unids.
                  low=t.lower()
                  i=low.find("trump")
                  if i>=0:
                      print("  TRUMP-SLICE", " ".join(t[max(0,i-600):i+1600].split()))
                  else:
                      print("  no 'trump' in this view response; head:")
                      print("  ", " ".join(t.split())[:1200])
              print("---")
          # 2) Test whether the OGE-hosted 278-T PDF has a real text layer.
          #    (The whitehouse.gov copy is a scanned image — empty text.)
          for pdf in [
              "https://extapps2.oge.gov/201/Presiden.nsf/PAS+Index/18353894FE440B3685258D430031A337/$FILE/Donald%20J.%20Trump%2010.20.2025%20278-T%20(2).pdf",
              "https://www.whitehouse.gov/wp-content/uploads/2026/03/President-Donald-J.-Trump-Periodic-Transaction-Report-2.26.26-1.pdf",
          ]:
              r=get(pdf)
              print("PDF", r.status_code if r else "n/a", len(r.content) if r else 0, pdf)
              if r and r.ok and r.content[:4]==b"%PDF":
                  try:
                      with pdfplumber.open(io.BytesIO(r.content)) as doc:
                          npg=len(doc.pages)
                          txt="\n".join((p.extract_text() or "") for p in doc.pages[:3])
                          nimg=sum(len(p.images) for p in doc.pages[:3])
                      print(f"  pages={npg} imgs(first3)={nimg} textlen={len(txt.strip())}")
                      print("  ===PDFTEXT==="); print(txt[:3500]); print("  ===END===")
                  except Exception as e:
                      print("  pdf-open err", e)
          PY

      - name: Estimate return-since-buy (non-fatal)
        env:
          # Accept the key whether it was added as an Actions *secret* (preferred)
          # or an Actions *variable* — both live under the same settings page.
          CONGRESS_PRICES_KEY: ${{ secrets.CONGRESS_PRICES_KEY || vars.CONGRESS_PRICES_KEY }}
        run: |
          # Prices move daily even when no new filing arrives, so this runs
          # every day. A price-source outage must not fail the whole refresh.
          python3 -m congress prices --top 0 --limit 1 2>&1 | tee -a fetch.log \
            || echo "::warning::price refresh failed; keeping prior returns.json"

      - name: Commit refreshed data
        run: |
          FILES="docs/data/congress-trades.json congress/state.json congress/members.json docs/data/returns.json"
          if git diff --quiet -- $FILES; then
            echo "No new trades or price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "congress: trades + returns refresh ($(date -u +%F))"
          # The branch may have moved while the fetch ran; rebase our data
          # commit on top rather than failing the push.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Upload fetch log and raw payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: congress-fetch-debug
          path: |
            fetch.log
            debug-dump/
          if-no-files-found: ignore
          retention-days: 7
