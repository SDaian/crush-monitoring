name: Congress trades refresh

on:
  schedule:
    - cron: "17 9 * * *" # daily, off the :00 stampede
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new filings per chamber this run (empty = no cap)"
        required: false
        default: ""
permissions:
  contents: write

concurrency:
  group: congress-trades
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: congress/requirements.txt

      - name: Install fetcher dependencies
        run: pip install -r congress/requirements.txt

      - name: Offline tests (parsers must be green before touching live sites)
        run: python3 -m unittest discover -s tests/congress -p 'test_*.py'

      - name: Refresh member roster (non-fatal)
        run: |
          python3 -m congress roster \
            || echo "::warning::roster refresh failed; using committed members.json"

      - name: Fetch new filings
        run: |
          set -o pipefail # tee must not mask the fetcher's exit code
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            EXTRA="--limit ${{ github.event.inputs.limit }} --debug-dump debug-dump"
          else
            EXTRA="" # full scheduled run: no dump (it would be huge)
          fi
          python3 -m congress fetch $EXTRA 2>&1 | tee fetch.log

      - name: TEMP OGE probe (Trump 278-T format)
        run: |
          python3 - <<'PY'
          import io, re, base64, requests, pdfplumber
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}
          def get(url, **k):
              try:
                  r=requests.get(url, headers=UA, timeout=60, **k); return r
              except Exception as e:
                  print("  ERR", e); return None
          def chunkb64(tag, data):
              b=base64.b64encode(data).decode()
              for i in range(0, len(b), 2000):
                  print(f"{tag} {i//2000:03d} {b[i:i+2000]}")
              print(f"{tag} END")
          # 1) Enumerate the categorized PAS Index view fully (ExpandView), then
          #    walk it: a category row sets the current filer; child rows carry
          #    the document unid + $FILE pdf link. Collect Trump's 278-T docs.
          r=get("https://extapps2.oge.gov/201/Presiden.nsf/PAS+Index?ReadViewEntries&OutputFormat=XML&ExpandView&count=5000")
          print("VIEW", r.status_code if r else "n/a", "len", len(r.text) if r else 0)
          if r and r.ok:
              t=r.text
              # Split into <viewentry ...>...</viewentry> blocks in document order.
              entries=re.findall(r"<viewentry\b[^>]*>.*?</viewentry>", t, re.S)
              print("  entries", entries, sep=" count=") if False else print("  entries count", len(entries))
              cur=None
              trump=[]
              for e in entries:
                  cat=re.search(r'category="true".*?<text>(.*?)</text>', e, re.S)
                  if cat:
                      cur=re.sub(r"\s+"," ", cat.group(1)).strip()
                      continue
                  if cur and "trump" in cur.lower():
                      unid=re.search(r'unid="([0-9A-F]+)"', e)
                      href=re.search(r"PAS\+Index/([0-9A-F]+)/\$FILE/([^'&]+\.pdf)", e)
                      label=re.search(r"</a>|;gt;([^<]*?)&lt;/a", e)
                      print("  TRUMP-CAT:", cur)
                      print("    ENTRY:", " ".join(e.split())[:600])
                      if href:
                          trump.append((href.group(1), href.group(2)))
              print("  TRUMP DOCS:", trump)
          # 2) Dump the FULL OGE-hosted 278-T text (all pages) as base64 for a
          #    faithful offline fixture, plus per-page text lengths.
          r=get("https://extapps2.oge.gov/201/Presiden.nsf/PAS+Index/18353894FE440B3685258D430031A337/$FILE/Donald%20J.%20Trump%2010.20.2025%20278-T%20(2).pdf")
          print("PDF", r.status_code if r else "n/a", len(r.content) if r else 0)
          if r and r.ok and r.content[:4]==b"%PDF":
              with pdfplumber.open(io.BytesIO(r.content)) as doc:
                  pages=[(p.extract_text() or "") for p in doc.pages]
              print("  pages", len(pages), "lens", [len(p) for p in pages])
              full="\n\f\n".join(pages)
              chunkb64("OGEB64", full.encode())
          PY

      - name: Estimate return-since-buy (non-fatal)
        env:
          # Accept the key whether it was added as an Actions *secret* (preferred)
          # or an Actions *variable* — both live under the same settings page.
          CONGRESS_PRICES_KEY: ${{ secrets.CONGRESS_PRICES_KEY || vars.CONGRESS_PRICES_KEY }}
        run: |
          # Prices move daily even when no new filing arrives, so this runs
          # every day. A price-source outage must not fail the whole refresh.
          python3 -m congress prices --top 0 --limit 1 2>&1 | tee -a fetch.log \
            || echo "::warning::price refresh failed; keeping prior returns.json"

      - name: Commit refreshed data
        run: |
          FILES="docs/data/congress-trades.json congress/state.json congress/members.json docs/data/returns.json"
          if git diff --quiet -- $FILES; then
            echo "No new trades or price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "congress: trades + returns refresh ($(date -u +%F))"
          # The branch may have moved while the fetch ran; rebase our data
          # commit on top rather than failing the push.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Upload fetch log and raw payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: congress-fetch-debug
          path: |
            fetch.log
            debug-dump/
          if-no-files-found: ignore
          retention-days: 7
