name: Congress trades refresh

on:
  schedule:
    - cron: "17 9 * * *" # daily, off the :00 stampede
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new filings per chamber this run (empty = no cap)"
        required: false
        default: ""
permissions:
  contents: write

concurrency:
  group: congress-trades
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: congress/requirements.txt

      - name: Install fetcher dependencies
        run: pip install -r congress/requirements.txt

      - name: Offline tests (parsers must be green before touching live sites)
        run: python3 -m unittest discover -s tests/congress -p 'test_*.py'

      - name: Refresh member roster (non-fatal)
        run: |
          python3 -m congress roster \
            || echo "::warning::roster refresh failed; using committed members.json"

      - name: Fetch new filings
        run: |
          set -o pipefail # tee must not mask the fetcher's exit code
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            EXTRA="--limit ${{ github.event.inputs.limit }} --debug-dump debug-dump"
          else
            EXTRA="" # full scheduled run: no dump (it would be huge)
          fi
          python3 -m congress fetch $EXTRA 2>&1 | tee fetch.log

      - name: TEMP OGE probe (categories tail + full-text search)
        run: |
          python3 - <<'PY'
          import re, requests
          from urllib.parse import quote
          UA={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}
          NSF="https://extapps2.oge.gov/201/Presiden.nsf"
          BASE=f"{NSF}/PAS+Index"
          def get(url):
              try: return requests.get(url, headers=UA, timeout=60)
              except Exception as e:
                  print("  ERR", e); return None
          CAT=re.compile(r'category="true"\s*>\s*<text>(.*?)</text>', re.S)
          VE=re.compile(r"<viewentry\b[^>]*>.*?</viewentry>", re.S)
          PDFRE=re.compile(r"PAS\+Index/([0-9A-Fa-f]+)/\$FILE/([^'&]+?\.pdf)")
          # A) Dump the tail of the 216 collapsed categories (where 'T' sorts).
          r=get(f"{BASE}?ReadViewEntries&OutputFormat=XML&Count=1000")
          cats=[re.sub(r"\s+"," ",c).strip() for c in CAT.findall(r.text)]
          print("A) total categories:", len(cats))
          for c in cats:
              if c[:1] in "STUV":
                  print("   CAT:", c[:70])
          # B) Domino full-text SearchView for the President's 278-T docs.
          for q in ("Trump", "278-T", "Trump 278-T"):
              u=f"{BASE}?SearchView&Query={quote(q)}&OutputFormat=XML&Count=80"
              r=get(u)
              if not r: continue
              ents=VE.findall(r.text)
              pdfs=PDFRE.findall(r.text.replace("&apos;","'"))
              print(f"B) SearchView Query={q!r} status={r.status_code} entries={len(ents)} pdfs={len(pdfs)}")
              for h in pdfs[:15]:
                  print("     PDF:", h[0], h[1][:70])
          # C) DB-wide SearchSite fallback.
          u=f"{NSF}?SearchView&Query={quote('Trump 278-T')}&OutputFormat=XML&Count=80"
          r=get(u)
          if r:
              pdfs=PDFRE.findall(r.text.replace("&apos;","'"))
              print("C) nsf SearchView status", r.status_code, "pdfs", len(pdfs), "len", len(r.text))
              for h in pdfs[:15]:
                  print("     PDF:", h[0], h[1][:70])
          PY

      - name: Estimate return-since-buy (non-fatal)
        env:
          # Accept the key whether it was added as an Actions *secret* (preferred)
          # or an Actions *variable* — both live under the same settings page.
          CONGRESS_PRICES_KEY: ${{ secrets.CONGRESS_PRICES_KEY || vars.CONGRESS_PRICES_KEY }}
        run: |
          # Prices move daily even when no new filing arrives, so this runs
          # every day. A price-source outage must not fail the whole refresh.
          python3 -m congress prices --top 0 --limit 1 2>&1 | tee -a fetch.log \
            || echo "::warning::price refresh failed; keeping prior returns.json"

      - name: Commit refreshed data
        run: |
          FILES="docs/data/congress-trades.json congress/state.json congress/members.json docs/data/returns.json"
          if git diff --quiet -- $FILES; then
            echo "No new trades or price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "congress: trades + returns refresh ($(date -u +%F))"
          # The branch may have moved while the fetch ran; rebase our data
          # commit on top rather than failing the push.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Upload fetch log and raw payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: congress-fetch-debug
          path: |
            fetch.log
            debug-dump/
          if-no-files-found: ignore
          retention-days: 7
