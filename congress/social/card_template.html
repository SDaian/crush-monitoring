<!doctype html>
<!-- The X/Twitter card template ("broadsheet" variant) rendered by
     scripts/render_card.mjs into a 1600x900 PNG. EDIT THIS FILE to change
     the card design — the pipeline only substitutes the {{PLACEHOLDER}}
     tokens and screenshots the result. Fonts are the repo-local woff2 files
     in ./fonts (self-contained: no CDN, no node_modules needed at render
     time), so CI output is deterministic.

     Placeholders:
       {{DISCLOSED_LONG}}  "Disclosed Jul 21, 2026" (masthead, right)
       {{WHO}}             "Sen. Alan Armstrong" (title-cased, prefixed)
       {{SEAT}}            "R · OK"
       {{ACTION}}          "Bought" / "Sold" / "Traded"
       {{SIDE_CLASS}}      "side-buy" / "side-sell" / "side-neutral"
       {{TICKER}}          "AAPL"
       {{COMPANY}}         "" or "Taiwan Semiconductor Manufacturing
                           Company Ltd." (the filing's asset name)
       {{EXTRA}}           "" or "+ 11 more trades in this filing"
       {{CONTEXT}}         "" or "Already holds ~$121K of AMZN — 4.2% of
                           their estimated portfolio" (rolled-forward
                           holdings estimate; empty when unavailable)
       {{STATS_HTML}}      "" or the ticker-across-Congress band
                           ("12 members have disclosed 50 trades — …")
       {{TX_DATE}}         "Mar 27, 2026"
       {{FILED_DATE}}      "Jul 21, 2026"
       {{DEADLINE_HTML}}   "<b>on time</b>" or
                           "<b class='late'>missed by 71 days</b>"
       {{STAMP_HTML}}      "" or "<div class='stampbox'>71 days late</div>"
       {{CARD_CLASS}}      "" or "has-portrait" (shifts content right)
       {{PORTRAIT_HTML}}   "" or the duotone portrait layer:
                           "<div class='portrait'><img src='file://…'>
                            <div class='credit'>Official portrait ·
                            public domain</div></div>"
-->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: LF; src: url(fonts/libre-franklin-latin-400-normal.woff2); font-weight: 400; }
@font-face { font-family: LF; src: url(fonts/libre-franklin-latin-800-normal.woff2); font-weight: 800; }
@font-face { font-family: LF; src: url(fonts/libre-franklin-latin-900-normal.woff2); font-weight: 900; }
@font-face { font-family: PM; src: url(fonts/ibm-plex-mono-latin-400-normal.woff2); font-weight: 400; }
@font-face { font-family: PM; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2); font-weight: 500; }
@font-face { font-family: PM; src: url(fonts/ibm-plex-mono-latin-700-normal.woff2); font-weight: 700; }
* { margin: 0; box-sizing: border-box; }
:root { --paper:#FBFBF9; --ink:#14161A; --soft:#5A5E66; --rule:#E3E2DC;
        --stamp:#C8102E; --buy:#0E7C4A; --sell:#B3261E; }
body { font-family: LF, sans-serif; }
.card { width: 1600px; height: 900px; overflow: hidden; position: relative;
        background: var(--paper); color: var(--ink); padding: 64px 72px;
        display: flex; flex-direction: column; }
.mast { display: flex; justify-content: space-between; align-items: baseline;
        border-bottom: 6px double var(--ink); padding-bottom: 22px; }
.wm { font-weight: 900; font-size: 44px; letter-spacing: -0.5px; }
.wm i { font-style: normal; color: var(--stamp); }
.dateline { font-family: PM; font-size: 26px; color: var(--soft);
            letter-spacing: 2px; text-transform: uppercase; }
.who { margin-top: 48px; font-family: PM; font-size: 30px; letter-spacing: 3px;
       text-transform: uppercase; color: var(--soft);
       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who b { color: var(--stamp); font-weight: 700; }
/* The headline clamps rather than overflowing: one line, ellipsis. Ticker
   symbols are <=10 chars so this only bites on absurd inputs. The bottom
   padding is NOT decorative: at line-height 1.0 the overflow:hidden box
   ends at the em box, shearing the descender off the "g" in "Bought" —
   padding sits inside the clip edge and gives the descender room. */
.headline { margin-top: 14px; font-weight: 900; font-size: 108px;
            letter-spacing: -3px; line-height: 1.0; padding-bottom: 0.25em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.headline .side-buy { color: var(--buy); }
.headline .side-sell { color: var(--sell); }
.headline .side-neutral { color: var(--ink); }
/* No margin-top: the headline's descender padding above already provides
   the visual gap. */
.company { font-family: PM; font-size: 30px; color: var(--soft);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.extra { margin-top: 16px; font-family: PM; font-size: 30px; color: var(--soft); }
.context { margin-top: 26px; font-family: PM; font-size: 32px; color: var(--ink);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Two margin-top:auto blocks (.stats and .meta) split the leftover
   vertical space evenly, so the stats band floats centered between the
   headline group and the bottom meta strip. */
.stats { margin-top: auto; border-top: 2px solid var(--rule); padding-top: 26px; }
.stats .k { font-family: PM; font-size: 21px; letter-spacing: 2.5px;
            text-transform: uppercase; color: var(--soft); margin-bottom: 14px; }
.stats .v { font-family: PM; font-size: 33px; line-height: 1.5; }
.stats b { font-weight: 700; }
.stats .up { color: var(--buy); }
.stats .down { color: var(--sell); }
.meta { margin-top: auto; display: flex; gap: 64px;
        border-top: 2px solid var(--ink); padding-top: 26px;
        font-family: PM; font-size: 27px; }
.meta .k { color: var(--soft); font-size: 21px; letter-spacing: 2.5px;
           text-transform: uppercase; display: block; margin-bottom: 8px; }
.meta b { font-weight: 700; }
.meta .late { color: var(--stamp); }
.stampbox { position: absolute; right: 66px; top: 300px; transform: rotate(-8deg);
            border: 6px solid var(--stamp); color: var(--stamp);
            font-family: PM; font-weight: 700; font-size: 44px;
            letter-spacing: 4px; padding: 18px 30px; text-transform: uppercase; }
/* Portrait layer (featured members with a photo in ./portraits/). The
   duotone is pure CSS — grayscale image screen-blended over stamp red, so
   shadows go red and highlights go paper — and the right edge fades into
   the page via a mask, like a print halftone bleeding into the column.
   Cards without a portrait file keep the full-width layout: .has-portrait
   is what makes room. */
.portrait { position: absolute; left: 0; top: 0; bottom: 0; width: 620px;
            background: var(--stamp); overflow: hidden;
            -webkit-mask-image: linear-gradient(to right, #000 72%, transparent 100%);
            mask-image: linear-gradient(to right, #000 72%, transparent 100%); }
.portrait img { width: 100%; height: 100%; object-fit: cover; object-position: top;
                filter: grayscale(1) contrast(1.06); mix-blend-mode: screen;
                display: block; }
.portrait .credit { position: absolute; left: 28px; bottom: 22px;
                    font-family: PM; font-size: 18px; letter-spacing: 2.5px;
                    text-transform: uppercase; color: rgba(251,251,249,.85); }
.has-portrait { padding-left: 660px; }
.has-portrait .stats .v { font-size: 27px; }
/* The narrower column would wrap the meta dates; tighten instead. */
.has-portrait .meta { gap: 40px; font-size: 24px; }
.has-portrait .meta .k { font-size: 19px; letter-spacing: 2px; }
.meta > span { white-space: nowrap; }
</style></head><body>
<div class="card {{CARD_CLASS}}" id="card">
  {{PORTRAIT_HTML}}
  <div class="mast">
    <span class="wm">CAPITOL <i>LEDGER</i></span>
    <span class="dateline">{{DISCLOSED_LONG}}</span>
  </div>
  <div class="who">{{WHO}} · <b>{{SEAT}}</b></div>
  <div class="headline">{{ACTION}} <span class="{{SIDE_CLASS}}">{{TICKER}}</span></div>
  <div class="company">{{COMPANY}}</div>
  <div class="extra">{{EXTRA}}</div>
  <div class="context">{{CONTEXT}}</div>
  {{STAMP_HTML}}
  {{STATS_HTML}}
  <div class="meta">
    <span><span class="k">Traded</span><b>{{TX_DATE}}</b></span>
    <span><span class="k">Disclosed</span><b>{{FILED_DATE}}</b></span>
    <span><span class="k">Filing deadline</span>{{DEADLINE_HTML}}</span>
    <span style="margin-left:auto"><span class="k">Source</span><b>official filings</b></span>
  </div>
</div>
</body></html>
