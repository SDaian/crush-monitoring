<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moved — Capitol Ledger trade tracker</title>
<!-- The tracker now lives on the site itself. GitHub Pages cannot serve a real
     301, so the canonical link is what consolidates ranking signals onto the
     new URL; the meta refresh and the script move actual visitors. Keep all
     three — a meta refresh alone is a weaker signal to search engines. -->
<link rel="canonical" href="https://capitolledger.io/tracker">
<meta http-equiv="refresh" content="0; url=https://capitolledger.io/tracker">
<meta name="robots" content="noindex, follow">
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #FBFBF9; color: #14161A; padding: 2rem;
    font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card { max-width: 34rem; text-align: center; }
  .mark {
    font-weight: 900; letter-spacing: -0.02em; text-transform: uppercase;
    font-size: 1.05rem; border-bottom: 3px double #14161A;
    padding-bottom: 0.75rem; margin-bottom: 1.5rem; display: inline-block;
  }
  .mark span { color: #C8102E; }
  h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 0.75rem; }
  p { color: #5A5E66; margin: 0 0 1.5rem; }
  a.go {
    display: inline-block; padding: 0.7rem 1.2rem; background: #14161A;
    color: #FBFBF9; text-decoration: none; font-family: ui-monospace, monospace;
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
  }
  a.go:hover { background: #C8102E; }
  .fine { font-size: 0.78rem; color: #5A5E66; margin-top: 1.5rem; }
  .fine a { color: #5A5E66; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">Capitol <span>Ledger</span></div>
    <h1>The tracker has moved.</h1>
    <p>
      It now lives on the main site, with per-ticker and per-member pages
      alongside it. You should be redirected automatically.
    </p>
    <a class="go" href="https://capitolledger.io/tracker">Open the tracker &rarr;</a>
    <p class="fine">
      Not redirected? Go to
      <a href="https://capitolledger.io/tracker">capitolledger.io/tracker</a>.
      Browse by <a href="https://capitolledger.io/tickers">stock</a> or by
      <a href="https://capitolledger.io/members">member</a>.
    </p>
  </div>
  <script>
    // replace() so the dead URL doesn't linger in the back-button history.
    location.replace("https://capitolledger.io/tracker");
  </script>
</body>
</html>
